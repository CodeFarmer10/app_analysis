version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - minio

  worker:
    build:
      context: ../backend
    command: celery -A workers.celery_app worker -c 10
    depends_on:
      - mysql
      - redis
      - minio

  scheduler:
    build:
      context: ../backend
    command: python workers/scheduler.py
    depends_on:
      - mysql
      - redis
      - minio

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
  minio_data:
