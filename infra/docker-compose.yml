version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - minio

  worker_static:
    build:
      context: ../backend
    command: celery -A workers.celery_app worker -Q queue_static -n static@%h -c 10 --prefetch-multiplier=1
    depends_on:
      - mysql
      - redis
      - minio

  worker_dynamic:
    build:
      context: ../backend
    command: celery -A workers.celery_app worker -Q queue_dynamic -n dynamic@%h -c 13 --prefetch-multiplier=1
    depends_on:
      - mysql
      - redis
      - minio

  worker_report:
    build:
      context: ../backend
    command: celery -A workers.celery_app worker -Q queue_report -n report@%h -c 1 --prefetch-multiplier=1
    depends_on:
      - mysql
      - redis
      - minio

  worker_download:
    build:
      context: ../backend
    command: celery -A workers.celery_app worker -Q queue_download -n download@%h -c 2 --prefetch-multiplier=1
    depends_on:
      - mysql
      - redis
      - minio

  scheduler:
    build:
      context: ../backend
    command: python workers/scheduler.py
    depends_on:
      - mysql
      - redis
      - minio

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
  minio_data:
